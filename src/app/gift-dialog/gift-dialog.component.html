<div class="title">{{this.data?.edit?'עריכת מתנה':'הוספת מתנה'}}</div>
<mat-divider></mat-divider>

<form [formGroup]="giftForm" class="giftForm">

    <!-- <mat-form-field class="example-full-width">
        <mat-label>שם מתנה</mat-label>
        <input matInput formControlName="giftName">
      </mat-form-field> -->
    <mat-form-field class="example-full-width">
        <mat-label>שם מתנה</mat-label>
        <mat-select formControlName="giftName" dir="rtl">
            <mat-option *ngFor="let c of giftsNameList" [value]="c.key">
                {{c.value}}
            </mat-option>
            <!-- <mat-option>
                <input matInput [(ngModel)]="newGift" placeholder="אחר">
                <mat-icon (click)="addCity(newGift)">adjust</mat-icon>
            </mat-option> -->
        </mat-select>
    </mat-form-field>

        <button matButton class="addGift" style="background-color:  rgb(215, 212, 212); color: black;" mat-raised-button
            color="red" (click)="addGift=true">הוספת מתנה</button>
    
    <div *ngIf="addGift"><app-add-item-to-combo-data [giftOrCity]="'gift'"
            (saveAddGift)="saveAddGiftFun($event)"></app-add-item-to-combo-data></div>

    <mat-form-field class="example-full-width">
        <mat-label class="date1">תאריך</mat-label>
        <input matInput class="date" [matDatepicker]="picker" [min]="minDate" [max]="maxDate"
            formControlName="receivedDate" [value]="giftForm.get('receivedDate')?.value">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- <mat-form-field class="example-full-width">
        <mat-label>הוספה</mat-label>
        <input matInput [(ngModel)]="newGift" placeholder="אחר">
        <button mat-icon-button matSuffix (click)="addCity(newGift)">
            <mat-icon>adjust</mat-icon>
        </button>
    </mat-form-field> -->


    <button class="cancel" style="background-color: rgb(215, 212, 212); color: white;" mat-raised-button color="gray"
        (click)="close()">ביטול</button>

    <button class="save" style="background-color: rgb(157, 142, 114); color: white;" mat-raised-button color="red"
        (click)="save()">שמור</button>

</form>
